<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epsilon — Becoming</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050507;
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      color: #fff;
    }
    canvas { display: block; }

    /* ─── Botón More Info ──────────────────────────────────── */
    .action-btn {
      position: fixed;
      bottom: 44px;
      right: 44px;
      padding: 14px 26px;
      background: rgba(212,175,55,0.10);
      border: 1px solid rgba(212,175,55,0.35);
      border-radius: 4px;
      color: #d4af37;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      z-index: 30;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
    }
    .action-btn:hover {
      background: rgba(212,175,55,0.20);
      border-color: rgba(212,175,55,0.70);
      box-shadow: 0 0 28px rgba(212,175,55,0.18);
      transform: translateY(-1px);
    }
    .action-btn:active { transform: translateY(0); background: rgba(212,175,55,0.30); }

    .loading {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.25);
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="loading">initializing flow —</div>

  <button class="action-btn" id="moreInfoBtn">
    More Info
  </button>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ─── Button → abre nueva página ──────────────────────
    const moreInfoBtn = document.getElementById('moreInfoBtn');
    moreInfoBtn.addEventListener('click', () => {
      moreInfoBtn.style.transform = 'scale(0.97)';
      setTimeout(() => moreInfoBtn.style.transform = '', 140);
      moreInfoBtn.style.boxShadow = '0 0 50px rgba(212,175,55,0.4)';
      setTimeout(() => moreInfoBtn.style.boxShadow = '', 650);
      // Abrir página de info en nueva pestaña
      window.open('/home/jeto/epsilon/info.html', '_blank');
    });

    // ─── Scene ───────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050507, 0.018);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    document.body.prepend(renderer.domElement);

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);

    // ─── Sphere (glass shell) ────────────────────────────────
    const sphereGeo = new THREE.SphereGeometry(3, 64, 64);
    const sphereMat = new THREE.MeshPhysicalMaterial({
      color: 0x0a0d18,
      transparent: true,
      opacity: 0.15,
      roughness: 0.05,
      metalness: 0.1,
      wireframe: false,
      side: THREE.DoubleSide,
      envMapIntensity: 0.6,
    });
    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    scene.add(sphere);

    // wireframe overlay
    const wireMat = new THREE.MeshBasicMaterial({
      color: 0xd4af37,
      wireframe: true,
      transparent: true,
      opacity: 0.08,
    });
    const wireSphere = new THREE.Mesh(sphereGeo.clone(), wireMat);
    wireSphere.scale.set(1.005, 1.005, 1.005);
    scene.add(wireSphere);

    // ─── Inner glow sphere ────────────────────────────────────
    const glowGeo = new THREE.SphereGeometry(2.6, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0x0c0f16,
      transparent: true,
      opacity: 0.4,
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    scene.add(glow);

    // ─── Particle flow system ────────────────────────────────
    const PARTICLE_COUNT = 6000;
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const sizes = new Float32Array(PARTICLE_COUNT);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);
    const phases = new Float32Array(PARTICLE_COUNT);

    const colorGold = new THREE.Color(0xd4af37);
    const colorBlue = new THREE.Color(0x4a8fe7);
    const colorWhite = new THREE.Color(0xffffff);
    const colorDim = new THREE.Color(0x1a2540);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 1.5 + Math.random() * 2.5;

      positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);

      const rand = Math.random();
      if (rand < 0.4) {
        const c = colorGold.clone().lerp(colorBlue, Math.random());
        colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
      } else if (rand < 0.55) {
        colors[i*3] = colorWhite.r; colors[i*3+1] = colorWhite.g; colors[i*3+2] = colorWhite.b;
      } else {
        const c = colorDim.clone().lerp(colorBlue, Math.random() * 0.5);
        colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
      }

      sizes[i] = 0.5 + Math.random() * 2.5;
      phases[i] = Math.random() * Math.PI * 2;

      const speed = 0.002 + Math.random() * 0.006;
      const angle = Math.atan2(positions[i*3+1], positions[i*3]);
      velocities[i*3]     = -Math.sin(angle) * speed;
      velocities[i*3 + 1] =  Math.cos(angle) * speed;
      velocities[i*3 + 2] = (Math.random() - 0.5) * 0.001;
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const particleMat = new THREE.PointsMaterial({
      size: 0.08,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // ─── Core energy orb ──────────────────────────────────────
    const coreGeo = new THREE.SphereGeometry(0.6, 24, 24);
    const coreMat = new THREE.MeshBasicMaterial({
      color: 0xd4af37,
      transparent: true,
      opacity: 0.7,
    });
    const core = new THREE.Mesh(coreGeo, coreMat);
    scene.add(core);

    const coreGlowGeo = new THREE.SphereGeometry(0.9, 16, 16);
    const coreGlowMat = new THREE.MeshBasicMaterial({
      color: 0xd4af37,
      transparent: true,
      opacity: 0.15,
    });
    const coreGlow = new THREE.Mesh(coreGlowGeo, coreGlowMat);
    scene.add(coreGlow);

    // ─── Background stars ─────────────────────────────────────
    const starCount = 800;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPos[i*3]     = (Math.random() - 0.5) * 80;
      starPos[i*3 + 1] = (Math.random() - 0.5) * 80;
      starPos[i*3 + 2] = (Math.random() - 0.5) * 80 - 20;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.05,
      transparent: true,
      opacity: 0.4,
      sizeAttenuation: true,
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // ─── Light ring ───────────────────────────────────────────
    const ringGeo = new THREE.RingGeometry(3.3, 3.5, 64);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xd4af37,
      transparent: true,
      opacity: 0.08,
      side: THREE.DoubleSide,
      depthWrite: false,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 3;
    scene.add(ring);

    const ring2 = new THREE.Mesh(
      new THREE.RingGeometry(3.6, 3.75, 64),
      new THREE.MeshBasicMaterial({ color: 0x4a8fe7, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false })
    );
    ring2.rotation.x = -Math.PI / 4;
    ring2.rotation.z = Math.PI / 6;
    scene.add(ring2);

    // ─── Animation ────────────────────────────────────────────
    let time = 0;

    function animate() {
      requestAnimationFrame(animate);
      time += 0.005;

      sphere.rotation.x = Math.sin(time * 0.3) * 0.05;
      sphere.rotation.y += 0.0015;
      wireSphere.rotation.copy(sphere.rotation);

      const pos = particles.geometry.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        pos[i*3]     += velocities[i*3] + Math.sin(time + phases[i]) * 0.0003;
        pos[i*3 + 1] += velocities[i*3 + 1] + Math.cos(time * 0.7 + phases[i]) * 0.0003;
        pos[i*3 + 2] += velocities[i*3 + 2] + Math.sin(time * 0.5 + phases[i] * 2) * 0.0002;

        const x = pos[i*3], y = pos[i*3+1], z = pos[i*3+2];
        const dist = Math.sqrt(x*x + y*y + z*z);
        if (dist > 4.5) {
          const scale = 3.5 / dist;
          pos[i*3]     *= scale;
          pos[i*3 + 1] *= scale;
          pos[i*3 + 2] *= scale;
        }
        if (dist < 0.8) {
          const scale = 1.2 / dist;
          pos[i*3]     *= scale;
          pos[i*3 + 1] *= scale;
          pos[i*3 + 2] *= scale;
        }
      }
      particles.geometry.attributes.position.needsUpdate = true;

      const pulse = 1 + Math.sin(time * 2) * 0.08;
      core.scale.set(pulse, pulse, pulse);
      coreGlow.scale.set(pulse * 1.5, pulse * 1.5, pulse * 1.5);
      coreGlow.material.opacity = 0.1 + Math.sin(time * 2) * 0.05;

      ring.rotation.z += 0.002;
      ring2.rotation.x += 0.001;
      ring2.rotation.y += 0.0015;

      sphere.material.opacity = 0.12 + Math.sin(time * 0.5) * 0.04;
      wireSphere.material.opacity = 0.06 + Math.sin(time * 0.7) * 0.03;

      stars.rotation.y += 0.0002;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
