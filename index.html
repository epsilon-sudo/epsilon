<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Epsilon — Building from 0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #050507;
      --text-primary: #eef0f5;
      --text-secondary: #8b96a8;
      --text-muted: #4a5568;
      --accent: #d4af37;
      --accent-dim: rgba(212, 175, 55, 0.3);
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      line-height: 1.5;
      background: radial-gradient(ellipse at 20% 30%, #0a0d18 0%, #050507 50%, #0c0f16 100%);
    }

    /* ═════════════ FLOATING BLOBS ═════════════ */
    .blobs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.65;
      mix-blend-mode: screen;
      will-change: transform;
    }

    .blob-1 {
      width: 700px;
      height: 700px;
      top: -10%;
      left: -8%;
      background: radial-gradient(circle, rgba(75, 140, 220, 0.8) 0%, transparent 70%);
      animation: floatA 24s ease-in-out infinite;
    }

    .blob-2 {
      width: 600px;
      height: 600px;
      bottom: -10%;
      right: -6%;
      background: radial-gradient(circle, rgba(120, 160, 210, 0.6) 0%, transparent 70%);
      animation: floatB 28s ease-in-out infinite;
    }

    .blob-3 {
      width: 300px;
      height: 300px;
      top: 25%;
      right: 4%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.4) 0%, transparent 70%);
      animation: floatC 20s ease-in-out infinite;
    }

    .blob-4 {
      width: 250px;
      height: 250px;
      bottom: 8%;
      left: 4%;
      background: radial-gradient(circle, rgba(200, 215, 245, 0.3) 0%, transparent 70%);
      animation: floatA 19s ease-in-out infinite reverse;
    }

    @keyframes floatA {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(35px, -40px) scale(1.08); }
      50% { transform: translate(-20px, 20px) scale(0.94); }
      75% { transform: translate(15px, 10px) scale(1.04); }
    }

    @keyframes floatB {
      0%, 100% { transform: translate(0, 0) scale(1); }
      30% { transform: translate(-40px, 30px) scale(1.12); }
      60% { transform: translate(25px, -15px) scale(0.92); }
    }

    @keyframes floatC {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-25px, -35px) scale(1.2); }
    }

    /* ═════════════ CONTENT ═════════════ */
    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      padding: 40px 24px;
      text-align: center;
      max-width: 640px;
    }

    /* ── Imagen del pulpo ── */
    .image-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(212, 175, 55, 0.1),
        inset 0 0 0 1px rgba(255, 255, 255, 0.07);
      transform: perspective(800px) rotateX(2deg) rotateY(-3deg);
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      will-change: transform;
    }

    .image-wrapper:hover {
      transform: perspective(800px) rotateX(0deg) rotateY(0deg) scale(1.04);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 60px rgba(212, 175, 55, 0.2),
        inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .image-wrapper:hover img {
      transform: scale(1.03) brightness(1.05);
    }

    /* Glow detrás de la imagen */
    .image-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300px;
      height: 300px;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center,
        rgba(212, 175, 55, 0.15) 0%,
        rgba(75, 140, 220, 0.08) 40%,
        transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: glowPulse 4s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    /* ── Título ── */
    .title {
      font-size: clamp(28px, 4.5vw, 40px);
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }

    .title .epsilon {
      color: var(--accent);
      font-style: italic;
    }

    .subtitle {
      font-size: clamp(13px, 2vw, 15px);
      color: var(--text-secondary);
      max-width: 380px;
      line-height: 1.6;
      margin-top: 6px;
    }

    /* ── Botón Instagram ── */
    .ig-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 30px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: translateY(0);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Brillo interno al hover */
    .ig-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center,
        rgba(212, 175, 55, 0.12) 0%,
        transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .ig-btn .arrow {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .ig-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(212, 175, 55, 0.35);
      transform: translateY(-3px) scale(1.02);
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.45),
        0 0 25px rgba(212, 175, 55, 0.12);
    }

    .ig-btn:hover::before { opacity: 1; }
    .ig-btn:hover .arrow { transform: translateX(4px); }
    .ig-btn:active { transform: translateY(0) scale(0.97); }

    /* Glow externo */
    .ig-btn::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50px;
      background: linear-gradient(
        135deg,
        rgba(212, 175, 55, 0.25),
        transparent 50%,
        rgba(75, 140, 220, 0.15) 100%
      );
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      z-index: -1;
    }

    .ig-btn:hover::after { opacity: 1; }

    /* Icono */
    .ig-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .ig-icon svg {
      width: 100%;
      height: 100%;
      fill: var(--accent);
      transition: fill 0.3s ease, transform 0.3s ease;
    }

    .ig-btn:hover .ig-icon svg {
      fill: #fff;
      transform: scale(1.12);
    }

    /* ── Footer ── */
    footer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      z-index: 1;
    }

    footer .a { color: var(--accent); opacity: 0.55; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .image-wrapper {
        width: 200px;
        height: 200px;
        border-radius: 16px;
      }
      .image-glow {
        width: 230px;
        height: 230px;
      }
      .ig-btn {
        padding: 12px 24px;
        font-size: 12px;
      }
      main { gap: 28px; padding: 24px 16px; }
    }
  </style>
</head>
<body>

  <!-- Bloobs flotantes -->
  <div class="blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <main>
    <div class="image-wrapper">
      <div class="image-glow"></div>
      <img src="image-9944b5.png" alt="Koro-sensei · Epsilon mascot" loading="eager" />
    </div>

    <h1 class="title">
      Epsilon · <span class="epsilon">building from 0</span>
    </h1>

    <p class="subtitle">
      A faceless personal brand documenting the reality of starting a company alone — no team, no investors, no filters.
    </p>

    <a href="https://www.instagram.com/undefined.0005/" target="_blank" rel="noopener noreferrer" class="ig-btn">
      <span class="ig-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2.163c3.204 0 3.584.012 3.584.012v1.953c0 .967-.775 1.743-1.743 1.743h-1.926c-.967 0-1.743-.776-1.743-1.743v-1.9c0-.964.776-1.743 1.743-1.743H12zm1.171 5.794c-.이엔지.154.276-.362.47-.62.578-.257.108-.544.162-.847.162-.653 0-1.098-.527-1.098-1.184 0-.656.445-1.184 1.098-1.184.276 0 .533.088.727.239.262.203.445.43.539.669.146.354.178.724.118 1.084-.137.745-.432 1.373-.864 1.848-.356.39-.78.644-1.28.724-.96.137-1.563-.61-1.563-1.812 0-.634.395-1.124.975-1.358.316-.136.658-.194 1.016-.172.274.016.533.094.727.239.188.14.312.31.379.498.077.21.062.43.023.637-.068.325-.196.61-.382.852-.246.32-.552.528-.925.6-.467.092-.972-.239-1.21-.79-.19-.463-.19-1.04.04-1.516.16-.347.4-.633.706-.84.304-.207.64-.343 1.01-.404.84-.137 1.476.414 1.476 1.516 0 .84-.586 1.444-1.387 1.564-.391.06-.792.04-1.158-.074-.405-.126-.834-.372-1.104-.77-.268-.395-.35-.864-.248-1.376.082-.412.318-.746.637-.964.365-.246.784-.373 1.172-.373.434 0 .82.166 1.073.478.238.303.323.68.254 1.042-.04.223-.166.416-.373.559-.295.207-.642.318-1.008.318z"/>
        </svg>
      </span>
      Follow on Instagram
      <span class="arrow">→</span>
    </a>
  </main>

  <footer>
    <span class="a">Epsilon</span> · building in public · 2026
  </footer>
</body>
</html>
