<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epsilon — More Info</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050507;
      color: #fff;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .content {
      max-width: 640px;
      width: 100%;
    }

    .title {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 300;
      line-height: 1.5;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.92);
      margin-bottom: 2.2rem;
    }
    .title .strong {
      color: #d4af37;
      font-weight: 400;
    }

    .line {
      display: block;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 300;
      line-height: 1.6;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.88);
      margin-bottom: 1.2rem;
    }
    .line em {
      color: rgba(212,175,55,0.85);
      font-style: italic;
    }
    .line.strong {
      color: #d4af37;
      font-weight: 400;
    }

    .gap {
      height: 0.8rem;
    }

    .sub {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* ─── Botón de Instagram ─────────────────────────────── */
    .ig-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 2.8rem;
      padding: 14px 28px;
      background: rgba(212,175,55,0.08);
      border: 1px solid rgba(212,175,55,0.40);
      border-radius: 4px;
      color: #d4af37;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .ig-btn:hover {
      background: rgba(212,175,55,0.18);
      border-color: #d4af37;
      box-shadow: 0 0 28px rgba(212,175,55,0.18);
      transform: translateY(-1px);
      color: #d4af37;
    }
    .ig-btn:active { background: rgba(212,175,55,0.26); transform: translateY(0); }
    .ig-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .fade-in {
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 1.1s ease forwards;
    }
    .fade-in.delay-1 { animation-delay: 0.1s; }
    .fade-in.delay-2 { animation-delay: 0.25s; }
    .fade-in.delay-3 { animation-delay: 0.45s; }
    .fade-in.delay-4 { animation-delay: 0.7s; }
    .fade-in.delay-5 { animation-delay: 0.95s; }
    .fade-in.delay-6 { animation-delay: 1.2s; }
    .fade-in.delay-7 { animation-delay: 1.5s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="content">

    <div class="title fade-in">
      <span class="strong">I hit bottom.</span> Today I just focus.
    </div>

    <span class="line fade-in delay-1">I have an idea that's being refined.</span>
    <span class="line fade-in delay-2"><em>The jump is yet to come.</em></span>

    <div class="gap fade-in delay-3"></div>

    <span class="line fade-in delay-4 strong">I'll do it with the help of <span style="color:#d4af37">scalable AI</span>, in public.</span>

    <div class="fade-in delay-5">
      <a class="ig-btn" href="https://www.instagram.com/undefined.0005/" target="_self">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="2" width="20" height="20" rx="4"/>
          <circle cx="12" cy="12" r="4.5"/>
          <circle cx="18" cy="6.5" r="1.2" fill="currentColor"/>
        </svg>
        Contact me on Instagram
      </a>
    </div>

    <div class="sub fade-in delay-6">
      Epsilon · in construction
    </div>

  </div>

</body>
</html>
